version: "3.9"

services:
  db:
    image: postgres:15
    container_name: meeting-scheduler-db
    restart: always
    environment:
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle123
      POSTGRES_DB: meeting_scheduler_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: meeting-scheduler-app
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/meeting_scheduler_db
      SPRING_DATASOURCE_USERNAME: doodle
      SPRING_DATASOURCE_PASSWORD: doodle123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
